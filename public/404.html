<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada · Casa Loy Tequilera</title>
  <meta name="description" content="La página que buscas no existe. Regresa al sitio oficial de Casa Loy Tequilera." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --copper: #8C4723;
      --gold:   #C8A86B;
      --cream:  #fcf9f3;
      --dark:   #1c1c18;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* ── Background video ── */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.25;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Texture overlay ── */
    .texture {
      position: fixed;
      inset: 0;
      background-image: url('/Fibras de Agave Cocido.webp');
      background-size: cover;
      opacity: 0.04;
      mix-blend-mode: overlay;
      z-index: 1;
      pointer-events: none;
    }

    /* ── Dark gradient overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(28,28,24,0.55) 0%, rgba(28,28,24,0.7) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      gap: 2rem;
    }

    /* Logo */
    .logo {
      height: 72px;
      width: auto;
      object-fit: contain;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.1s;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.25s;
    }
    .divider-line { width: 40px; height: 0.5px; background: rgba(200,168,107,0.35); }
    .divider-dot  { color: var(--gold); font-size: 8px; }

    /* 404 number */
    .number {
      font-family: 'EB Garamond', serif;
      font-size: clamp(96px, 20vw, 180px);
      line-height: 1;
      color: var(--cream);
      opacity: 0;
      letter-spacing: -0.02em;
      animation: fadeUp 1s ease forwards 0.35s;
    }

    /* Label */
    .label {
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(252,249,243,0.55);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.5s;
    }

    /* Title */
    .title {
      font-family: 'EB Garamond', serif;
      font-size: clamp(22px, 4vw, 38px);
      font-weight: 400;
      color: var(--gold);
      letter-spacing: 0.04em;
      font-style: italic;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.6s;
    }

    /* Description */
    .desc {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(252,249,243,0.5);
      max-width: 340px;
      line-height: 1.9;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.72s;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.85s;
    }

    @media (min-width: 480px) {
      .actions { flex-direction: row; }
    }

    .btn-primary {
      display: inline-block;
      padding: 0.85rem 2.25rem;
      background: var(--copper);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--copper);
      transition: background 0.4s ease, transform 0.2s ease, box-shadow 0.4s ease;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #b86e42;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(140,71,35,0.35);
    }

    .btn-secondary {
      display: inline-block;
      padding: 0.85rem 2.25rem;
      background: transparent;
      color: rgba(252,249,243,0.65);
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(252,249,243,0.2);
      transition: border-color 0.4s ease, color 0.4s ease, transform 0.2s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-1px);
    }

    /* Footer note */
    .footer-note {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(252,249,243,0.2);
      margin-top: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 1s;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* Decorative side lines */
    .line-left, .line-right {
      position: fixed;
      top: 0;
      width: 0.5px;
      height: 100%;
      background: rgba(252,249,243,0.06);
      z-index: 3;
      pointer-events: none;
    }
    .line-left  { left:  clamp(1.5rem, 5vw, 4rem); }
    .line-right { right: clamp(1.5rem, 5vw, 4rem); }
  </style>
</head>
<body>

  <!-- Background video -->
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="/recorrido-campos-casa-loy.mp4" type="video/mp4" />
  </video>

  <!-- Overlays -->
  <div class="texture"></div>
  <div class="overlay"></div>
  <div class="line-left"></div>
  <div class="line-right"></div>

  <!-- Content -->
  <div class="content">
    <img
      class="logo"
      src="/Logotipo Casa Loy Tequilera Color Blanco.png"
      alt="Casa Loy Tequilera"
    />

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-dot">◆</span>
      <div class="divider-line"></div>
    </div>

    <p class="number">404</p>

    <p class="label">Página no encontrada</p>

    <p class="title">Este destino no existe&hellip; aún.</p>

    <p class="desc">
      La página que buscas no se encuentra disponible.<br />
      Regresa al origen y descubre nuestra experiencia.
    </p>

    <div class="actions">
      <a href="https://casaloy.com" class="btn-primary">Ir a Casa Loy</a>
      <a href="https://casaloy.com/#menu" class="btn-secondary">Ver Restaurante</a>
    </div>

    <p class="footer-note">Casa Loy Tequilera &nbsp;·&nbsp; Ayotlán, Jalisco</p>
  </div>

</body>
</html>
